# Wakes the free-plan server every hour and runs reminders + expiry (a sleeping server runs no timers).
name: housekeeping
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run housekeeping on the live server
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://dextra-qfz7.onrender.com/internal/housekeeping
